services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: urbanmap-postgis
    environment:
      POSTGRES_DB: urbanmap
      POSTGRES_USER: urbanmap
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5432:5432"
    volumes:
      - urbanmap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanmap -d urbanmap"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  urbanmap_pgdata:
